title = "barterkin gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Paths to exclude from scanning"
paths = [
  '''\.planning/''',
  '''legacy/''',
  '''\.env\.local$''',
  '''\.env\.local\.example$''',
  '''pnpm-lock\.yaml$''',
  '''\.github/workflows/.+\.yml$''',
]

regexes = [
  '''secrets\.GITHUB_TOKEN''',
  '''hfdcsickerggcdvejbcw''',
  '''wnyev3689z''',
  '''X-Barterkin-Webhook-Secret''',
  '''webhook-secret''',
]
